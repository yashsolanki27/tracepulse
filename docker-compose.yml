services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tracepulse
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build: ./app
    restart: unless-stopped
    ports:
      - "8001:8000"
    env_file:
      - .env
    volumes:
      - ./prompts:/app/prompts:ro
    depends_on:
      - db

volumes:
  pgdata:
